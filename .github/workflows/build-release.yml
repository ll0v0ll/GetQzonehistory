name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        include:
          - os: windows-latest
            target: win
            suffix: '.exe'
          - os: macos-latest
            target: mac
            suffix: ''
          - os: ubuntu-latest
            target: linux
            suffix: ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get install -y libzbar0

      - name: Install system dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install zbar

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build with PyInstaller (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          pyinstaller --onefile --noconsole --name "GetQzonehistory_${{ matrix.target }}" --add-data "resource;resource" main_gui.py

      - name: Build with PyInstaller (Mac/Linux)
        if: matrix.os != 'windows-latest'
        run: |
          pyinstaller --onefile --name "GetQzonehistory_${{ matrix.target }}" --add-data "resource:resource" main_gui.py

      - name: Verify artifact
        run: |
          ls -la dist/
          test -f "dist/GetQzonehistory_${{ matrix.target }}${{ matrix.suffix }}" && echo "ARTIFACT OK"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GetQzonehistory_${{ matrix.target }}
          path: dist/GetQzonehistory_${{ matrix.target }}${{ matrix.suffix }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/GetQzonehistory_win/GetQzonehistory_win.exe
            artifacts/GetQzonehistory_mac/GetQzonehistory_mac
            artifacts/GetQzonehistory_linux/GetQzonehistory_linux
          body: |
            ## GetQzonehistory ${{ github.ref_name }}

            ### 使用方法
            1. 下载对应系统的可执行文件
            2. Windows 用户直接双击运行 `GetQzonehistory_win.exe`（GUI 版，扫码登录 QQ 空间账号）
            3. Mac/Linux 用户需要先赋予执行权限: `chmod +x GetQzonehistory_mac` 或 `chmod +x GetQzonehistory_linux`
            4. 在账号列表页选择已登录账号，或扫码登录新账号
            5. 登录后可拉取历史说说，并导出 Excel / HTML / 图片

            ### 数据说明
            - 运行时数据（登录状态、导出结果、缓存、日志）保存在可执行文件所在目录下的 `data/` 文件夹
            - 首次运行自动生成 `config.ini` 配置文件

            ### 更新内容
            请查看 [commits](https://github.com/${{ github.repository }}/commits/${{ github.ref_name }})
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
